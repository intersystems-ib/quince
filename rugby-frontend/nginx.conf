server {
  listen 80;
  charset utf-8;
  location /api/v1/ {
    proxy_pass http://webgateway;
    proxy_set_header Host $http_host;
    proxy_read_timeout 30s;
  }
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
